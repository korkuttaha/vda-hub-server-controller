name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (ör. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Single-File Exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve release tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag.StartsWith('release/')) { $tag = $tag.Substring('release/'.Length) }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish Single-File Self-Contained Exe
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Package Server Controller and PC Agent
        shell: pwsh
        run: |
          Copy-Item ./publish/VdaHubServerController.exe ./publish/VDAKorPcAgent.exe
          Compress-Archive -Path ./publish/VdaHubServerController.exe, ./config.example.json, ./README.md -DestinationPath ./publish/vda-hub-server-controller-win-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ./publish/VdaHubServerController.exe
            ./publish/VDAKorPcAgent.exe
            ./publish/vda-hub-server-controller-win-x64.zip
          name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
